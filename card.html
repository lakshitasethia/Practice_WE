<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        padding: 20px;
      }

      .container {
        margin: 20px auto;
        width: 600px;
        background-color: #f8d7da;
        border-radius: 10px;
        padding: 30px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      .header {
        text-align: center;
        margin-bottom: 30px;
      }

      .header h1 {
        font-size: 24px;
        color: #333;
        font-weight: bold;
      }

      .details {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      .form-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      label {
        width: 130px;
        font-weight: bold;
        color: #333;
        text-align: left;
        flex-shrink: 0;
      }

      input[type="text"],
      input[type="number"],
      input[type="email"],
      input[type="password"],
      textarea,
      select {
        padding: 5px 8px;
        border: 1px solid #ccc;
        border-radius: 3px;
        font-size: 12px;
        flex: 1;
        max-width: 200px;
      }

      input[type="text"]:focus,
      input[type="number"]:focus,
      input[type="email"]:focus,
      input[type="password"]:focus,
      textarea:focus,
      select:focus {
        border-color: #007bff;
        outline: none;
      }

      .name-inputs, .dob-inputs, .mobile-inputs {
        display: flex;
        gap: 5px;
        align-items: center;
      }

      .name-inputs input,
      .dob-inputs input,
      .mobile-inputs input {
        max-width: 80px;
      }

      .radio-group, .checkbox-group {
        display: flex;
        gap: 15px;
        align-items: center;
      }

      .radio-group label, .checkbox-group label {
        width: auto;
        font-weight: normal;
      }

      input[type="radio"], input[type="checkbox"] {
        margin-right: 5px;
      }

      textarea {
        max-width: 300px;
        min-height: 60px;
        resize: vertical;
      }

      select {
        max-width: 250px;
      }

      .register-btn {
        text-align: center;
        margin-top: 20px;
      }

      button {
        background-color: #007bff;
        color: white;
        padding: 8px 20px;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
        font-weight: bold;
      }

      button:hover {
        background-color: #0056b3;
      }

      .dob-format {
        font-size: 11px;
        color: #666;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <form action="">
      <div class="container">
        <div class="header">
          <h1>Student Registration Form</h1>
        </div>
        <div class="details">
          <div class="form-row">
            <label for="roll_no">Roll no.:</label>
            <input type="text" id="roll_no" />
          </div>

          <div class="form-row">
            <label for="name">Student name:</label>
            <div class="name-inputs">
              <input type="text" id="first_name" placeholder="First Name" />
              <span>-</span>
              <input type="text" id="last_name" placeholder="Last Name" />
            </div>
          </div>

          <div class="form-row">
            <label for="father_name">Father's name:</label>
            <input type="text" id="father_name" />
          </div>

          <div class="form-row">
            <label for="dob">Date of birth:</label>
            <div class="dob-inputs">
              <input type="number" id="day" placeholder="Day" min="1" max="31" />
              <span>-</span>
              <input type="number" id="month" placeholder="Month" min="1" max="12" />
              <span>-</span>
              <input type="number" id="year" placeholder="Year" min="1980" max="2010" />
              <span class="dob-format">(DD-MM-YYYY)</span>
            </div>
          </div>

          <div class="form-row">
            <label for="mobile">Mobile no.:</label>
            <div class="mobile-inputs">
              <input type="text" id="country_code" placeholder="+91" maxlength="4" />
              <span>-</span>
              <input type="text" id="mobile_number" placeholder="Mobile Number" />
            </div>
          </div>

          <div class="form-row">
            <label for="email">Email id:</label>
            <input type="email" id="email" />
          </div>

          <div class="form-row">
            <label for="password">Password:</label>
            <input type="password" id="password" />
          </div>

          <div class="form-row">
            <label for="gender">Gender:</label>
            <div class="radio-group">
              <label><input type="radio" name="gender" value="Male" />Male</label>
              <label><input type="radio" name="gender" value="Female" />Female</label>
            </div>
          </div>

          <div class="form-row">
            <label for="department">Department:</label>
            <div class="checkbox-group">
              <label><input type="checkbox" name="department" value="CSE" />CSE</label>
              <label><input type="checkbox" name="department" value="IT" />IT</label>
              <label><input type="checkbox" name="department" value="ECE" />ECE</label>
              <label><input type="checkbox" name="department" value="Civil" />Civil</label>
              <label><input type="checkbox" name="department" value="Mech" />Mech</label>
            </div>
          </div>

          <div class="form-row">
            <label for="course">Course:</label>
            <select name="course" id="course">
              <option value="">------Select Current Course's------</option>
              <option value="Computer Engineering">Computer Engineering</option>
              <option value="Information Technology">Information Technology</option>
              <option value="Electronics and Communication">Electronics and Communication</option>
              <option value="Civil Engineering">Civil Engineering</option>
              <option value="Mechanical Engineering">Mechanical Engineering</option>
            </select>
          </div>

          <div class="form-row">
            <label for="photo">Student photo:</label>
            <input type="file" name="photo" id="photo" accept="image/*" />
          </div>

          <div class="form-row">
            <label for="city">City:</label>
            <input type="text" id="city" />
          </div>

          <div class="form-row">
            <label for="address">Address:</label>
            <textarea name="address" id="address" cols="30" rows="4" placeholder="Enter your address"></textarea>
          </div>

          <div class="register-btn">
            <button type="submit">Register</button>
          </div>
        </div>
      </div>
    </form>
  </body>
</html>
